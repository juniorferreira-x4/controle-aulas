<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English class — Gutierrez Ferreira</title>
<meta name="theme-color" content="#0E141B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* Tela pensada para computador: larga, compacta e horizontal. */
  body { font-size: 15px; }
  .tela { max-width: 1480px; margin: 0 auto; padding: 18px 32px 28px; display: flex; flex-direction: column; gap: 16px; min-height: 100vh; }
  .tela-cab { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--borda); padding-bottom: 10px; }
  .tela-cab .marca-sup { font-size: 11px; }
  .tela-etapa { font-size: 20px; font-weight: 700; }
  .palco { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
  .palco.com-lado { grid-template-columns: minmax(0, 1fr) 320px; }
  .principal { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; align-items: start; }
  .lado { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 16px; }
  .bloco { border: 1px solid var(--borda); border-radius: 12px; background: var(--painel); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
  .bloco h2 { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--acento-texto); margin: 0; }
  .bloco ol { margin: 0; padding-left: 24px; display: flex; flex-direction: column; gap: 8px; font-size: 16px; line-height: 1.45; }
  .bloco.grande { grid-column: 1 / -1; text-align: center; padding: 32px 24px; }
  .bloco.grande p { margin: 0; font-size: 26px; font-weight: 600; line-height: 1.3; }
  .bloco.texto { grid-column: 1 / -1; }
  .bloco.texto p { margin: 0; font-size: 16px; line-height: 1.7; white-space: pre-line; color: var(--texto-2); }
  .bloco.dicas { border-style: dashed; border-color: var(--alerta-borda); background: var(--alerta-fundo); }
  .bloco.dicas h2 { color: var(--alerta); }
  .bloco.dicas ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
  .bloco.dicas p { margin: 0; font-size: 14px; }
  .hw { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(0, 2fr); gap: 16px; grid-column: 1 / -1; align-items: start; }
  .hw-titulo { font-size: 18px; font-weight: 700; }
  /* Exercício: ocupa a tela sozinho; cada item numa linha, enunciado à esquerda e resposta à direita. */
  .bloco.exercicio { border-color: var(--acento-borda); grid-column: 1 / -1; }
  .ex-cab { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .ex-lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; counter-reset: ex; }
  .ex-lista li { counter-increment: ex; display: grid; grid-template-columns: 28px minmax(0, 1fr) minmax(0, 1.15fr); gap: 4px 14px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--borda); }
  .ex-lista li:last-child { border-bottom: 0; }
  .ex-lista li::before { content: counter(ex) "."; color: var(--muted); font-size: 15px; }
  .ex-enun { font-size: 16px; }
  .ex-lista input { font-size: 15px; min-height: 38px; }
  .ex-gab { grid-column: 3; font-size: 14px; font-weight: 600; }
  .ex-escrita { display: grid; grid-template-columns: minmax(240px, 1fr) minmax(0, 2.4fr); gap: 18px; align-items: start; }
  .ex-escrita textarea { min-height: 300px; font-size: 15px; line-height: 1.6; }
  .ex-tema { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.45; }
  #ex-relogio { font-size: 18px; font-weight: 600; }
  .aguardando { margin: auto; text-align: center; color: var(--muted); }
  @media (max-width: 900px) {
    .tela { padding: 16px; }
    .palco.com-lado, .hw, .ex-escrita { grid-template-columns: minmax(0, 1fr); }
    .lado { position: static; }
    .ex-lista li { grid-template-columns: 24px minmax(0, 1fr); }
    .ex-lista input, .ex-gab { grid-column: 2; }
  }
</style>
</head>
<body>
<main class="tela" id="tela"><div class="aguardando">Carregando…</div></main>
<script type="module" src="js/tela.js"></script>
</body>
</html>
